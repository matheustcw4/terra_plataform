[project]
name = "terra-backend"
version = "0.1.0"
description = "Projeto Terra — plataforma unificada (planilhas + Metryx): banco canônico, adapters e API"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.143.1",
    "uvicorn[standard]==0.54.0",
    "SQLAlchemy==2.1.4",
    "psycopg[binary]==3.3.6",
    "alembic==1.20.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "openpyxl==3.1.5",
    "python-calamine==0.8.3",
    "httpx==0.28.1",
    "tenacity==9.2.1",
    "cryptography==50.0.2",
    "PyJWT==2.15.1",
    "argon2-cffi==25.1.0",
    "celery[redis]==5.6.3",
    "redis==6.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90"]
# SIM108 sugere trocar if/else por expressão condicional numa linha; aqui preferimos o if/else explícito
ignore = ["SIM108"]

[tool.ruff.lint.mccabe]
max-complexity = 10           # função com mais caminhos que isso tem de ser quebrada (legibilidade)

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
"validacao/*.py" = ["E501", "C901"]   # scripts de validação (SQL longo)
"tests/*.py" = ["E501"]               # SQL nas asserções

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
