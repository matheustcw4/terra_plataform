name: terra

services:
  db:
    image: postgres:16
    container_name: terra_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-terra}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?defina APP_USER_PASSWORD no .env}
      APP_ETL_PASSWORD: ${APP_ETL_PASSWORD:?defina APP_ETL_PASSWORD no .env}
      TZ: America/Cuiaba
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # roda só na 1ª inicialização do volume: cria os papéis app_owner/app_user/app_etl
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
