name: terra

services:
  db:
    image: postgres:16
    container_name: terra_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-terra}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?defina APP_USER_PASSWORD no .env}
      APP_ETL_PASSWORD: ${APP_ETL_PASSWORD:?defina APP_ETL_PASSWORD no .env}
      TZ: America/Cuiaba
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # roda só na 1ª inicialização do volume: cria os papéis app_owner/app_user/app_etl
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # a fila das cargas no desenvolvimento (worker e "Atualizar agora"); porta própria: a 6379 desta máquina é de outro
  # projeto. Nada em disco: o resultado de cada carga fica no banco.
  redis:
    image: redis:7-alpine
    container_name: terra_redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORTA:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
